name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy all apps to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync SvelteKit
        run: |
          npx svelte-kit sync
          cd packages/core && npx svelte-kit sync
          cd ../docs && npx svelte-kit sync

      - name: Build library packages
        run: pnpm --filter '!@vultra/docs' --filter '!@vultra/storybook' --filter '!@vultra/template-*' run build

      - name: Build and deploy Docs (ui.vultra.id)
        run: |
          pnpm --filter @vultra/docs build
          pnpm dlx wrangler pages deploy packages/docs/build \
            --project-name=vultra-docs \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Build and deploy Storybook (stories.vultra.id)
        run: |
          pnpm --filter @vultra/storybook build-storybook
          pnpm dlx wrangler pages deploy packages/storybook/storybook-static \
            --project-name=vultra-storybook \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Build and deploy SaaS Template (saas.vultra.id)
        run: |
          pnpm --filter @vultra/template-saas build
          pnpm dlx wrangler pages deploy packages/template-saas/build \
            --project-name=vultra-saas-template \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Build and deploy Commerce Template (shop.vultra.id)
        run: |
          pnpm --filter @vultra/template-commerce build
          pnpm dlx wrangler pages deploy packages/template-commerce/build \
            --project-name=vultra-shop \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Build and deploy Flutter Web Template (flutter.vultra.id)
        run: |
          pnpm --filter @vultra/template-flutter-web build
          pnpm dlx wrangler pages deploy packages/template-flutter-web/build \
            --project-name=vultra-flutter-template \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
