name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core packages
        run: |
          pnpm --filter @vultra/ui build
          pnpm --filter @vultra/md3 build
          pnpm --filter @vultra/flat build
          pnpm --filter @vultra/grid-core build
          pnpm --filter @vultra/data-table build
          pnpm --filter @vultra/editor-core build
          pnpm --filter @vultra/cli build

      - name: Run tests
        run: pnpm --filter @vultra/ui test

      - name: Build docs
        run: pnpm --filter @vultra/docs build
