name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'packages/tokens/**'
      - 'packages/core/**'
      - 'packages/md3/**'
      - 'packages/flat/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy docs to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @vultra/tokens build
          pnpm --filter @vultra/ui build
          pnpm --filter @vultra/md3 build
          pnpm --filter @vultra/flat build

      - name: Build docs
        run: pnpm --filter @vultra/docs build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy packages/docs/build --project-name=vultra-docs --branch=main
          workingDirectory: .