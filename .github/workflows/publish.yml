name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch/minor/major)'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  publish:
    name: Publish all packages to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump versions
        run: |
          node -e "
            const fs = require('fs');
            const bump = '${{ github.event.inputs.version }}';
            for (const f of fs.readdirSync('packages').map(d => 'packages/' + d + '/package.json')) {
              if (!fs.existsSync(f)) continue;
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              if (j.private) continue;
              const [base, suffix] = j.version.split('-');
              const v = base.split('.').map(Number);
              if (bump === 'minor') v[1]++;
              else if (bump === 'major') v[0]++;
              else v[2]++;
              if (suffix) {
                // alpha.N -> alpha.N+1 (keep the same prerelease tag)
                const m = suffix.match(/^(alpha)\.(\d+)(.*)$/);
                j.version = v.join('.') + '-' + (m ? m[1] + '.' + (Number(m[2]) + 1) : suffix);
              } else {
                j.version = v.join('.') + '-alpha.0';
              }
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
          "
          echo "--- Bumped versions ---"
          grep -h '"version"' packages/*/package.json | sort | uniq -c

      - name: Build core packages
        run: |
          pnpm --filter @vultra/ui build
          pnpm --filter @vultra/md3 build
          pnpm --filter @vultra/flat build
          pnpm --filter @vultra/grid-core build
          pnpm --filter @vultra/data-table build
          pnpm --filter @vultra/editor-core build
          pnpm --filter @vultra/cli build

      - name: Rewrite workspace:* deps to versions
        run: ./scripts/stage-publish.sh --rewrite-only

      - name: Publish all packages in dependency order
        run: |
          set -e
          # Dependency-first order: tokens, ui deps, then leaf packages
          ORDER=(tokens grid-core core md3 flat cli editor-core native rich-text motion \
                 motion-captions motion-effects motion-media motion-player motion-studio \
                 motion-three book-writer calendar charts collaboration kanban pdf-viewer \
                 slides spreadsheet data-table)
          for pkg in "${ORDER[@]}"; do
            if [ -d "packages/$pkg" ]; then
              echo "--- Publishing @vultra/$pkg ---"
              (cd packages/$pkg && npm publish --tag alpha 2>&1 | tail -2)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published versions
        run: |
          for pkg in tokens grid-core core md3 flat cli editor-core native rich-text motion data-table; do
            v=$(npm view @vultra/$pkg@alpha version 2>/dev/null | tail -1)
            echo "@vultra/$pkg: $v"
          done

      - name: Summarize
        run: |
          echo "## Packages published (alpha)" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY